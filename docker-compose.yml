services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical-synthesis-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
      - RECORDS_DIR=/app/records
    volumes:
      - backend_records:/app/records
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clinical-synthesis-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend_records:

